# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    # The `std` variant enables every feature, so the `write` builders and the ELF
    # and LZ4 paths are compiled; the `no-std` variant drops default features and
    # cross-compiles to a target that has no std at all, which is what catches a
    # dependency enabling std behind the crate's back.
    #
    # aarch64-unknown-none stands in for the console's own
    # aarch64-nintendo-switch-freestanding, which is tier 3 and would need
    # -Z build-std; both are 64-bit aarch64, so pointer width and alignment match.
    #
    # --all-targets belongs to the `std` variant alone: the test and bench targets
    # link the libtest harness, which needs std and a panic handler.
    name: check (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: std
            target: ''
            flags: '--all-targets --all-features'
          - variant: no-std
            target: aarch64-unknown-none
            flags: '--no-default-features --target aarch64-unknown-none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          components: clippy
          cache: true
          rustflags: ''

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: check
        run: just check ${{ matrix.flags }}

      - name: clippy
        run: just clippy ${{ matrix.flags }} -- -D warnings --force-warn deprecated --force-warn dead-code

  # Tests run in the std configuration only: the harness needs std, so there is
  # nothing to execute on the bare-metal target the `no-std` variant builds for.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3.4.0
        with:
          crate: cargo-nextest
          version: ^0.9
          locked: true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: test
        run: just test --all-features

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `just fmt-check` invokes `cargo +nightly fmt`, which resolves the
      # `nightly` channel rather than the pin in rust-toolchain.toml, so rustfmt
      # has to be installed on that channel and not on the pinned one.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
          rustflags: ''

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: fmt-check
        run: just fmt-check
