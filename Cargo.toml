[package]
name = "nx-object"
version = "0.1.0"
edition = "2024"
description = "Zero-copy parsing and generation of Nintendo Switch executable formats"
repository = "https://github.com/nx-std/nx-object"
license = "MIT"
keywords = ["nintendo-switch", "nro", "nso", "romfs", "no-std"]
categories = ["parser-implementations", "no-std"]

[lib]
name = "nx_object"
crate-type = ["rlib"]
doctest = false
bench = false

[features]
## Every format and the standard library, so a consumer who names none gets the whole crate
default = ["all-formats", "std"]
## Every format at once, for a consumer that would rather not list them
all-formats = ["cnmt", "kip", "mod0", "nacp", "nca", "npdm", "nro", "nso", "pfs0", "romfs"]
## The heap the builders assemble an image on, which is all they need beyond `no_std`
alloc = ["serde?/alloc", "zerocopy/alloc"]
## CNMT, the content meta naming every NCA of a title
cnmt = []
## ELF parsing, for deriving NRO and NSO segments from a linked binary.
## Pulls `nro` and `nso`: it derives the segments by driving those two builders.
elf-parsing = ["std", "nro", "nso", "dep:object"]
## KIP1, the image a kernel initial process is loaded from
kip = []
## LZ4 compression and decompression of NSO segments.
## Pulls `nso`: the segments it compresses are that builder's.
lz4-compression = ["alloc", "nso", "dep:lz4_flex"]
## MOD0, the module header an NRO or NSO points at
mod0 = []
## NACP, the control property naming a title
nacp = []
## NCA, the container a title's contents are distributed in.
## Pulls `sha2`: every section of an NCA is covered by a hash tree or table built here.
nca = ["alloc", "dep:sha2"]
## NPDM, the metadata describing a program's permissions
npdm = []
## NRO, the relocatable object homebrew ships as
nro = []
## NSO, the shared object official software ships as.
## Pulls `sha2`: an NSO header carries a digest of each segment, so building one hashes them.
nso = ["dep:bitflags", "dep:sha2"]
## PFS0, the partition archive an NSP is built from
pfs0 = []
## RomFS, the read-only filesystem an image carries
romfs = []
## `serde` derives on the NPDM builder's inputs, for a consumer that reads them from a config file
serde = ["alloc", "dep:serde"]
## The standard library, which is what the `from_directory` builders need: a filesystem to walk and
## a `PathBuf` to name what they found in. It carries `fs-err` for the same reason.
##
## Every dependency that draws a line between `core` and `std` is told which side this build is on,
## rather than being left on the `no_std` side of it because that is what the bare-metal build needs.
std = [
    "alloc",
    "dep:fs-err",
    "bitflags?/std",
    "serde?/std",
    "sha2?/std",
    "thiserror/std",
    "zerocopy/std",
]

[dependencies]
bitflags = { version = "2.9", optional = true }
fs-err = { version = "3.1", optional = true }
lz4_flex = { version = "0.11", optional = true, default-features = false }
object = { version = "0.38", optional = true, default-features = false, features = ["read", "elf"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
sha2 = { version = "0.10", optional = true, default-features = false }
static_assertions = "1.1"
thiserror = { version = "2.0", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
