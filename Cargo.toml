[package]
name = "nx-object"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_object"
crate-type = ["rlib"]
doctest = false
bench = false

[features]
## Default features, enabled unless default-features = false
default = []
## ELF parsing, for deriving NRO and NSO segments from a linked binary
elf-parsing = ["filesystem-support", "dep:object"]
## Filesystem-backed write layer: the format builders and their output paths
filesystem-support = ["dep:fs-err", "dep:sha2", "dep:bit_field", "serde/std"]
## LZ4 compression and decompression of NSO segments
lz4-compression = ["filesystem-support", "dep:lz4_flex"]

[dependencies]
bit_field = { version = "0.10", optional = true }
bitflags = "2.9"
fs-err = { version = "3.1", optional = true }
lz4_flex = { version = "0.11", optional = true, default-features = false }
object = { version = "0.38", optional = true, default-features = false, features = ["read", "elf"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { version = "0.10", optional = true, default-features = false }
static_assertions = "1.1"
thiserror = { workspace = true }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
